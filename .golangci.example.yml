---
# Example golangci-lint v2 config enabling the reusability Module Plugin.
# Requires a custom binary built from .custom-gcl.yml (golangci-lint custom).
version: '2'
linters:
  default: none
  enable: [reusability]
  settings:
    custom:
      reusability:
        type: module
        description: Enforce Go type reusability policy thresholds
        settings:
          patterns: [./...]
          tests: false
          generated: false
          dependency-scope: module
          field-usage: direct
          reusability-weights:
            cohesion: 0.35
            coupling: 0.25
            testability: 0.25
            documentation: 0.15
          rules:
            - pattern: "**/internal/**"
              min: 0.8
            - pattern: "**"
              min: 0.6
