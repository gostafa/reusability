---
# Example golangci-lint v2 config enabling the reusability Module Plugin.
# Requires a custom binary built from .custom-gcl.yml (golangci-lint custom).
version: '2'
linters:
  default: none
  enable: [reusability]
  settings:
    custom:
      reusability:
        type: module
        description: Enforce Go type reusability policy thresholds
        settings:
          dependency-scope: module
          field-usage: direct
          rules:
            - pattern: '**'
              min: 0.60
            # A more-specific package path overrides the baseline.
            - pattern: github.com/example/project/internal/dto
              min: 0.50
